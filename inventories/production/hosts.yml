---
# Inventory for the VM list in ./vmlist.
#
# IMPORTANT: 10.10.10.0/24 is a placeholder network for the Proxmox cloud.
# 203.0.113.0/24 is a separate placeholder for pg03 in the second cloud.
# Replace ansible_host values with the addresses from your hypervisor / IPAM
# before running. Hostnames are intentionally stable: they are used by
# PostgreSQL replication, nginx upstreams and by the /etc/hosts block managed
# by the common role.

all:
  children:
    gitlab:
      hosts:
        gitlab01:
          ansible_host: 10.10.10.11

    postgres:
      children:
        postgres_primary:
          hosts:
            pg01:
              ansible_host: 10.10.10.12
        postgres_replicas:
          hosts:
            pg02:
              ansible_host: 10.10.10.13
            # pg03 is in another cloud. Replace this placeholder with its
            # real management address.
            pg03:
              ansible_host: 203.0.113.14
        # pg03 is a cascading replica: it follows pg02, never pg01 directly.
        postgres_cascading:
          hosts:
            pg03:

    # Valkey runs on the same VM as the primary PostgreSQL instance.
    valkey:
      hosts:
        pg01:

    docker:
      children:
        docker_prod:
          hosts:
            docker-prod-01:
              ansible_host: 10.10.10.15
            docker-prod-02:
              ansible_host: 10.10.10.16
        docker_test:
          hosts:
            docker-test-01:
              ansible_host: 10.10.10.17

    elk:
      hosts:
        elk01:
          ansible_host: 10.10.10.18

    nginx:
      hosts:
        nginx01:
          ansible_host: 10.10.10.19

    maintenance:
      hosts:
        maint01:
          ansible_host: 10.10.10.20

    # Hosts that ship logs with Filebeat. ELK is excluded because it stores
    # the logs itself; add or remove groups here if needed.
    log_shippers:
      children:
        gitlab:
        postgres:
        docker:
        nginx:
        maintenance:
