---
# Inventory for the VM list in ./vmlist.
#
# All VMs use public addresses. The 203.0.113.0/24 range is a documentation
# placeholder: replace every ansible_host below with the real public address
# of that VM. There is no private management network. Hostnames are
# intentionally stable: they are used by PostgreSQL replication, nginx
# upstreams and by the /etc/hosts block managed by the common role.
#
# Proxmox provisioning is optional and is not part of site.yml. The VMs are
# expected to exist before bootstrap.

all:
  children:
    gitlab:
      hosts:
        gitlab01:
          ansible_host: 176.53.238.74

    postgres:
      children:
        postgres_primary:
          hosts:
            # Public PostgreSQL endpoint is also in host_vars/pg01.yml.
            pg01:
              ansible_host: 176.53.238.140
        postgres_replicas:
          hosts:
            # Public PostgreSQL endpoint is also in host_vars/pg02.yml.
            pg02:
              ansible_host: 136.234.13.107
            # pg03 is in another cloud.
            pg03:
              ansible_host: 168.113.135.163
        # pg03 is a cascading replica: it follows pg02, never pg01 directly.
        postgres_cascading:
          hosts:
            pg03:

    # Valkey runs on the same VM as the primary PostgreSQL instance.
    valkey:
      hosts:
        pg01:

    docker:
      children:
        docker_prod:
          hosts:
            docker-prod-01:
              ansible_host: 176.53.238.7
            # Second production host, located in another cloud.
            docker-prod-02:
              ansible_host: 203.0.113.16
        docker_test:
          hosts:
            docker-test-01:
              ansible_host: 203.0.113.17

    elk:
      hosts:
        elk01:
          ansible_host: 161.104.58.201

    nginx:
      hosts:
        nginx01:
          ansible_host: 109.172.99.224

    maintenance:
      hosts:
        maint01:
          ansible_host: 203.0.113.20

    # Hosts that ship logs with Filebeat. ELK is excluded because it stores
    # the logs itself; add or remove groups here if needed.
    log_shippers:
      children:
        gitlab:
        postgres:
        docker:
        nginx:
        maintenance:
