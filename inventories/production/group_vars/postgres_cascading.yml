---
# pg03 receives WAL from pg02 in the second cloud. This is the source CIDR
# that pg02 sees. Replace it with pg03's real egress/NAT address or the
# second-cloud subnet used by the VPN.
postgres_replication_source_cidr: "203.0.113.14/32"

# Placeholder management network for the second cloud. Replace it before
# bootstrap, otherwise UFW would allow SSH only from internal_network.
common_firewall_ssh_sources:
  - "{{ internal_network }}"
  - "203.0.113.0/24"
