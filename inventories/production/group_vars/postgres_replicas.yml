---
postgres_role: "replica"
# Set to true to force a full pg_basebackup and wipe the replica data directory.
postgres_replica_rebuild: false

# pg02 additionally allows pg03 from the second cloud in host_vars/pg02.yml.
firewall_extra_rules:
  - port: "5432"
    proto: "tcp"
    from: "{{ internal_network }}"
