---
elasticsearch_cluster_name: "tlcamp-logs"
# The current ELK test VM has 4 GB RAM. Keep both JVMs small enough that
# Elasticsearch, Kibana and Logstash can run together without swap.
elasticsearch_heap_size: "1g"
kibana_public_base_url: "https://{{ kibana_hostname }}"
logstash_beats_port: 5044
logstash_heap_size: "512m"

# elk01 is exposed directly to the internet. Kibana terminates TLS itself on
# port 443; Elasticsearch stays on loopback and Logstash only accepts Beats
# traffic from the log_shippers hosts.
kibana_host: "0.0.0.0"
kibana_port: 443
kibana_tls_enabled: true
kibana_letsencrypt_enabled: true
kibana_letsencrypt_email: "admin@{{ internal_domain }}"
kibana_health_url: "https://127.0.0.1:443/api/status"

common_sysctl_extra:
  vm.max_map_count: 262144
  fs.file-max: 2097152

# Filebeat sources are taken from the inventory. Hosts still using the
# documentation range 203.0.113.0/24 are ignored until they get a real public
# address; this keeps Logstash closed to everything except project VMs.
logstash_allowed_sources: "{{ groups['log_shippers']
  | map('extract', hostvars)
  | map(attribute='ansible_host')
  | reject('match', '^203[.]0[.]113[.]')
  | list }}"

firewall_extra_rules:
  - port: "80"
    proto: "tcp"
  - port: "443"
    proto: "tcp"

# Beats traffic is accepted only from the project VMs listed above.
common_firewall_source_rules:
  - port: "5044"
    proto: "tcp"
    sources: "{{ logstash_allowed_sources }}"
