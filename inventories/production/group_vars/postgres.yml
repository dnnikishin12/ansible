---
postgres_version: "18"
postgres_port: 5432
postgres_client_networks:
  - "{{ internal_network }}"

# pg01 -> pg02 -> pg03. pg03 is in another cloud and must not connect to pg01
# directly. Slots are created on each direct upstream: replica_pg02 on pg01 and
# replica_pg03 on pg02. Replicas absent from this map connect directly to the
# primary, which preserves the default non-cascading topology.
postgres_replication_topology:
  pg02: pg01
  pg03: pg02

# Application databases/users are intentionally empty by default. Add entries
# here once the application schema is known, for example:
#
# postgres_users:
#   - name: app
#     password: "{{ vault_postgres_app_password }}"
#     role_attr_flags: "LOGIN"
# postgres_databases:
#   - name: app
#     owner: app
#     encoding: "UTF-8"
postgres_users: []
postgres_databases: []
postgres_privileges: []

postgres_walg_enabled: true
postgres_walg_s3_prefix: "s3://db-backup/db/pg{{ postgres_version }}/main-encrypted-v1"
postgres_walg_s3_endpoint: "https://hb.ru-msk.vkcloud-storage.ru"
postgres_walg_s3_region: "ru-msk"
# Two copies are required. Replace the placeholder secondary prefix with a
# real bucket (the role rejects CHANGE-ME). If the second S3 uses another
# account, also set vault_walg_secondary_s3_access_key_id and
# vault_walg_secondary_s3_secret_access_key in the vault; otherwise the
# primary WAL-G credentials are reused.
postgres_walg_secondary_enabled: true
# postgres_walg_secondary_s3_prefix: "s3://CHANGE-ME-secondary-bucket/db/pg{{ postgres_version }}/main-encrypted-v1"
# postgres_walg_secondary_s3_endpoint: "https://hb.ru-msk.vkcloud-storage.ru"
# postgres_walg_secondary_s3_region: "ru-msk"
postgres_walg_full_schedule: "Sun *-*-* 02:00:00"
postgres_walg_diff_schedule: "*-*-* 03:00:00"
