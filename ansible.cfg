# Ansible configuration for the TLCamp infrastructure.
# Docs: https://docs.ansible.com/ansible/latest/reference_appendices/config.html

[defaults]
inventory = inventories/production/hosts.yml
roles_path = roles
collections_path = ~/.ansible/collections:/usr/share/ansible/collections
host_key_checking = True
retry_files_enabled = False
# Facts are gathered on every run: with a small static inventory, stale cached
# facts after reprovisioning a VM are more dangerous than the saved seconds.
gathering = implicit
forks = 10
stdout_callback = default
result_format = yaml
callbacks_enabled = profile_tasks
interpreter_python = auto_silent
deprecation_warnings = False

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s
