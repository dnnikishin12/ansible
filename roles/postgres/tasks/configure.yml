---
- name: Ensure the PostgreSQL conf.d directory exists
  ansible.builtin.file:
    path: "{{ postgres_conf_dir }}/conf.d"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Ensure the PostgreSQL log directory exists
  ansible.builtin.file:
    path: /var/log/postgresql
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Enable the conf.d include in postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ postgres_conf_file }}"
    regexp: "^#?include_dir\\s*=\\s*'conf.d'"
    line: "include_dir = 'conf.d'"
    state: present

- name: Deploy PostgreSQL tuning and replication settings
  ansible.builtin.template:
    src: 99-ansible.conf.j2
    dest: "{{ postgres_conf_dir }}/conf.d/99-ansible.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart PostgreSQL

- name: Deploy pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgres_hba_file }}"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart PostgreSQL

- name: Apply pending PostgreSQL configuration changes
  ansible.builtin.meta: flush_handlers

- name: Wait for PostgreSQL to accept connections
  ansible.builtin.wait_for:
    host: "{{ '127.0.0.1' if postgres_listen_addresses in ['0.0.0.0', '*'] else postgres_listen_addresses }}"
    port: "{{ postgres_port }}"
    timeout: 60
    delay: 2
