---
- name: Validate the PostgreSQL replication password
  ansible.builtin.assert:
    that:
      - postgres_replication_password | default('') | length >= 16
      - "'ChangeMe' not in (postgres_replication_password | default(''))"
    fail_msg: >-
      Set a real vault_postgres_replication_password in the encrypted vault
      (at least 16 characters, not the ChangeMe placeholder).
  no_log: true

- name: Build and validate the replication topology
  ansible.builtin.import_tasks: topology.yml

- name: Install PostgreSQL packages
  ansible.builtin.import_tasks: install.yml

- name: Remove the legacy logical backup units
  ansible.builtin.import_tasks: backup-legacy.yml
  when: inventory_hostname in groups['postgres_primary'] | default([])

# Install WAL-G before the restart in configure.yml: archive_mode=on must not
# point at a missing archive_command binary even briefly on a fresh host.
- name: Configure WAL-G physical backups
  ansible.builtin.import_tasks: backup.yml
  when:
    - inventory_hostname in groups['postgres_primary'] | default([])
    - postgres_walg_enabled | bool

- name: Disable WAL-G physical backups
  ansible.builtin.import_tasks: backup-disable.yml
  when:
    - inventory_hostname in groups['postgres_primary'] | default([])
    - not (postgres_walg_enabled | bool)

- name: Configure PostgreSQL
  ansible.builtin.import_tasks: configure.yml

- name: Run the initial WAL-G full backup
  ansible.builtin.systemd:
    name: wal-g-backup@full.service
    state: started
    daemon_reload: true
  when:
    - inventory_hostname in groups['postgres_primary'] | default([])
    - postgres_walg_enabled | bool
    - postgres_walg_run_initial_backup | bool

- name: Remove helpers for a disabled second WAL-G copy
  ansible.builtin.import_tasks: backup-secondary-disable.yml
  when:
    - inventory_hostname in groups['postgres_primary'] | default([])
    - postgres_walg_enabled | bool
    - not (postgres_walg_secondary_enabled | bool)

- name: Configure the primary
  ansible.builtin.import_tasks: primary.yml
  when: inventory_hostname in groups['postgres_primary'] | default([])

- name: Configure a streaming replica
  ansible.builtin.import_tasks: replica.yml
  when: inventory_hostname in groups['postgres_replicas'] | default([])

# Run after replica.yml: bootstrapping a replica wipes its data directory and
# therefore any downstream slots that were created before pg_basebackup.
- name: Configure replication slots for downstream replicas
  ansible.builtin.import_tasks: slots.yml
  when: postgres_downstream_replicas | length > 0
