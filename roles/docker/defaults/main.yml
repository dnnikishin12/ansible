---
docker_apt_arch: >-
  {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, 'amd64') }}
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_users:
  - "{{ common_admin_user | default('deploy') }}"
docker_apps_dir: "/srv/docker"

docker_log_max_size: "100m"
docker_log_max_file: "5"
docker_live_restore: true
docker_daemon_config:
  log-driver: "json-file"
  log-opts:
    max-size: "{{ docker_log_max_size }}"
    max-file: "{{ docker_log_max_file }}"
  live-restore: "{{ docker_live_restore }}"
  iptables: true

docker_prune_enabled: true
docker_prune_schedule: "Sun *-*-* 04:00:00"
docker_prune_filter: "until=168h"
