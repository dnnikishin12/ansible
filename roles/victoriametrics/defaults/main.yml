---
victoriametrics_version: "v1.155.0"
victoriametrics_arch: >-
  {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, 'amd64') }}
victoriametrics_checksums:
  amd64: "7180e65913d55ab99c0be8f4a3ad17a0fafe5598a21ff6327fecba3190d7b176"
  arm64: "c6af3f35c597e2cb45c9bbb7a7fc1638c6f1ec10a8198c2861aa14531bf439d7"
victoriametrics_release_base: "https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download"
victoriametrics_download_url: >-
  {{ victoriametrics_release_base ~ '/' ~ victoriametrics_version
     ~ '/victoria-metrics-linux-' ~ victoriametrics_arch
     ~ '-' ~ victoriametrics_version ~ '.tar.gz' }}

victoriametrics_user: "victoriametrics"
victoriametrics_group: "victoriametrics"
victoriametrics_data_dir: "/var/lib/victoria-metrics"
victoriametrics_conf_dir: "/etc/victoriametrics"
victoriametrics_http_addr: "127.0.0.1:8428"
victoriametrics_retention: "12"
victoriametrics_memory_allowed_percent: 40
victoriametrics_scrape_interval: "30s"
victoriametrics_scrape_timeout: "20s"
