---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart Elasticsearch
  ansible.builtin.service:
    name: elasticsearch
    state: restarted

- name: Restart Kibana
  ansible.builtin.service:
    name: kibana
    state: restarted

- name: Restart Logstash
  ansible.builtin.service:
    name: logstash
    state: restarted
