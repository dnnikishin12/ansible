---
elasticsearch_cluster_name: "tlcamp-logs"
elasticsearch_node_name: "{{ inventory_hostname }}"
elasticsearch_heap_size: "{{ [(ansible_memtotal_mb * 0.5) | int, 31744] | min }}m"
elasticsearch_http_host: "127.0.0.1"
elasticsearch_http_port: 9200
elasticsearch_security_enabled: true

kibana_host: "0.0.0.0"
kibana_port: 443
kibana_public_base_url: "https://kibana.local"

# Kibana can terminate TLS itself. The certificate is issued by Let's Encrypt
# with the standalone HTTP-01 challenge and copied to a kibana-readable path.
kibana_tls_enabled: true
kibana_tls_cert_dir: "/etc/kibana/certs"
kibana_tls_cert_path: "{{ kibana_tls_cert_dir }}/kibana.crt"
kibana_tls_key_path: "{{ kibana_tls_cert_dir }}/kibana.key"
kibana_letsencrypt_enabled: true
kibana_letsencrypt_email: "admin@{{ internal_domain | default('example.com') }}"
kibana_health_url: >-
  {{ (('https' if kibana_tls_enabled | bool else 'http')
      ~ '://127.0.0.1:' ~ kibana_port ~ '/api/status') }}
kibana_health_validate_certs: false

logstash_heap_size: "1g"
logstash_beats_port: 5044
logstash_http_host: "127.0.0.1"
logstash_http_port: 9600

elastic_password: "{{ vault_elastic_password | default('') }}"
kibana_system_password: "{{ vault_kibana_system_password | default('') }}"
logstash_internal_password: "{{ vault_logstash_internal_password | default('') }}"
elasticsearch_health_retries: 90
elasticsearch_health_delay: 5
