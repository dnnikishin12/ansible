---
blackbox_exporter_version: "0.29.1"
blackbox_exporter_arch: >-
  {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, 'amd64') }}
blackbox_exporter_checksums:
  amd64: "b82b81839e6317e84fdd367f46d7ddd3b773fa09cbe2e3d5633a59171d741e76"
  arm64: "c597b0d442c02c0f2c8f691cbc7784216c786fada28f300c7b914e1f94523834"
blackbox_exporter_release_base: "https://github.com/prometheus/blackbox_exporter/releases/download"
blackbox_exporter_download_url: >-
  {{ blackbox_exporter_release_base ~ '/v' ~ blackbox_exporter_version
     ~ '/blackbox_exporter-' ~ blackbox_exporter_version
     ~ '.linux-' ~ blackbox_exporter_arch ~ '.tar.gz' }}
blackbox_exporter_extract_dir: >-
  {{ '/tmp/blackbox_exporter-' ~ blackbox_exporter_version
     ~ '.linux-' ~ blackbox_exporter_arch }}

blackbox_exporter_user: "blackbox-exporter"
blackbox_exporter_group: "blackbox-exporter"
blackbox_exporter_conf_dir: "/etc/blackbox_exporter"
blackbox_exporter_port: 9115
blackbox_exporter_listen_address: "127.0.0.1:{{ blackbox_exporter_port }}"
