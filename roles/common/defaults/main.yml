---
common_timezone: "UTC"
common_manage_hostname: true

common_packages:
  - acl
  - apt-transport-https
  - ca-certificates
  - chrony
  - curl
  - fail2ban
  - gnupg
  - htop
  - jq
  - logrotate
  - python3-systemd
  - qemu-guest-agent
  - rsync
  - rsyslog
  - sudo
  - tmux
  - ufw
  - unattended-upgrades
  - vim

common_manage_admin_user: true
common_admin_user: "deploy"
common_admin_group: "deploy"
common_admin_shell: "/bin/bash"
common_admin_sudo_nopasswd: true
common_admin_extra_groups: []
common_admin_authorized_keys: []

common_ssh_port: 22
common_ssh_service: "ssh"
common_ssh_hardening: true
common_ssh_password_authentication: false
common_ssh_permit_root_login: "prohibit-password"
common_ssh_max_auth_tries: 4
common_ssh_client_alive_interval: 300
common_ssh_client_alive_count_max: 2

common_ntp_servers:
  - "0.pool.ntp.org"
  - "1.pool.ntp.org"
  - "2.pool.ntp.org"
  - "3.pool.ntp.org"

common_journald_system_max_use: "1G"
common_journald_runtime_max_use: "256M"
common_journald_max_retention: "30day"
common_nofile_limit: 65535

common_unattended_upgrades_enabled: true
common_unattended_upgrades_reboot: false

common_fail2ban_enabled: true
common_fail2ban_bantime: "1h"
common_fail2ban_findtime: "10m"
common_fail2ban_maxretry: 5
common_fail2ban_ignoreips: []

common_firewall_enabled: true
common_firewall_default_incoming: "deny"
common_firewall_default_outgoing: "allow"
common_firewall_ssh_sources:
  - "0.0.0.0/0"
common_firewall_rules: []

common_sysctl:
  vm.swappiness: 10
  fs.file-max: 2097152
  net.core.somaxconn: 4096
  net.ipv4.tcp_syncookies: 1
common_sysctl_extra: {}
