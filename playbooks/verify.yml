---
# Post-deployment smoke checks. Run after site.yml:
#   ansible-playbook playbooks/verify.yml
- name: Verify connectivity and baseline services
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for the SSH connection
      ansible.builtin.wait_for_connection:
        timeout: 30

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Define the services expected on this host
      ansible.builtin.set_fact:
        verify_services: "{{ ['ssh.service']
          + (['postgresql@' ~ postgres_version ~ '-main.service']
             if inventory_hostname in (groups['postgres'] | default([])) else [])
          + (['valkey-server.service']
             if inventory_hostname in (groups['valkey'] | default([])) else [])
          + (['docker.service']
             if inventory_hostname in (groups['docker'] | default([])) else [])
          + (['gitlab-runsvdir.service']
             if inventory_hostname in (groups['gitlab'] | default([])) else [])
          + (['elasticsearch.service', 'kibana.service', 'logstash.service']
             if inventory_hostname in (groups['elk'] | default([])) else [])
          + (['nginx.service']
             if inventory_hostname in (groups['nginx'] | default([])) else [])
          + (['filebeat.service']
             if inventory_hostname in (groups['log_shippers'] | default([])) else []) }}"

    - name: Check that expected services are running
      ansible.builtin.assert:
        that:
          - item in ansible_facts.services
          - ansible_facts.services[item].state == 'running'
        fail_msg: "Service {{ item }} is not running on {{ inventory_hostname }}"
        success_msg: "Service {{ item }} is running"
      loop: "{{ verify_services }}"
      loop_control:
        label: "{{ item }}"

- name: Verify PostgreSQL streaming replication topology
  hosts: postgres
  become: true
  gather_facts: false
  tasks:
    - name: Import the PostgreSQL replication topology facts
      ansible.builtin.import_tasks: ../roles/postgres/tasks/topology.yml

    - name: Verify WAL-G archiving on the primary
      when:
        - inventory_hostname in groups['postgres_primary'] | default([])
        - postgres_walg_enabled | default(true) | bool
      block:
        - name: Read the effective PostgreSQL archive settings
          community.postgresql.postgresql_query:
            query: >-
              SELECT current_setting('archive_mode') AS archive_mode,
                     current_setting('archive_command') AS archive_command
            login_user: postgres
            login_unix_socket: /var/run/postgresql
          become: true
          become_user: postgres
          register: postgres_archive
          changed_when: false

        - name: Assert that WAL archiving uses WAL-G
          ansible.builtin.assert:
            that:
              - postgres_archive.query_result[0].archive_mode == 'on'
              - >-
                ('wal-push' in postgres_archive.query_result[0].archive_command)
                or ((postgres_walg_archive_script | default('/usr/local/sbin/walg-archive'))
                    in postgres_archive.query_result[0].archive_command)
              - >-
                not (postgres_walg_secondary_enabled | default(true) | bool)
                or ((postgres_walg_archive_script | default('/usr/local/sbin/walg-archive'))
                    in postgres_archive.query_result[0].archive_command)
            fail_msg: >-
              archive_mode/archive_command are not configured for WAL-G on
              {{ inventory_hostname }}. When the second S3 copy is enabled,
              archive_command must call the dual-target walg-archive helper.

        - name: Verify that the WAL-G timers are active  # noqa: command-instead-of-module
          ansible.builtin.command:
            cmd: "systemctl is-active --quiet {{ item }}"
          loop:
            - wal-g-full.timer
            - wal-g-diff.timer
          changed_when: false

        - name: List backups in the primary WAL-G storage
          ansible.builtin.command:
            cmd: "{{ postgres_walg_wrapper | default('/usr/local/bin/walg') }} backup-list --json"
          become: true
          become_user: postgres
          register: postgres_walg_primary_backups
          changed_when: false
          when: postgres_walg_secondary_enabled | default(true) | bool

        - name: List backups in the second WAL-G storage
          ansible.builtin.command:
            cmd: >-
              {{ postgres_walg_secondary_wrapper | default('/usr/local/bin/walg-secondary') }}
              backup-list --json
          become: true
          become_user: postgres
          register: postgres_walg_secondary_backups
          changed_when: false
          when: postgres_walg_secondary_enabled | default(true) | bool

        - name: Assert that every primary backup is present in the second S3
          ansible.builtin.assert:
            that:
              - >-
                (postgres_walg_primary_backups.stdout | from_json
                 | map(attribute='backup_name') | list
                 | difference(postgres_walg_secondary_backups.stdout | from_json
                              | map(attribute='backup_name') | list)
                 | length) == 0
            fail_msg: >-
              One or more WAL-G backups from the primary S3 are missing in the
              second S3 on {{ inventory_hostname }}. Check the
              wal-g-backup@full/diff.service logs and run the copy command
              again.
          when: postgres_walg_secondary_enabled | default(true) | bool

    - name: Count streaming downstream replicas
      community.postgresql.postgresql_query:
        query: >-
          SELECT count(*) AS replicas
          FROM pg_stat_replication
          WHERE state = 'streaming'
        login_user: postgres
        login_unix_socket: /var/run/postgresql
      become: true
      become_user: postgres
      register: postgres_replication
      changed_when: false
      failed_when: >-
        (postgres_replication.query_result[0].replicas | int) !=
        (postgres_downstream_replicas | length)

    - name: Verify that a replica is running in recovery
      community.postgresql.postgresql_query:
        query: "SELECT pg_is_in_recovery() AS in_recovery"
        login_user: postgres
        login_unix_socket: /var/run/postgresql
      become: true
      become_user: postgres
      register: postgres_recovery
      changed_when: false
      failed_when: not (postgres_recovery.query_result[0].in_recovery | bool)
      when: inventory_hostname in groups['postgres_replicas'] | default([])

    - name: Verify that a replica's WAL receiver is streaming
      community.postgresql.postgresql_query:
        query: "SELECT status FROM pg_stat_wal_receiver"
        login_user: postgres
        login_unix_socket: /var/run/postgresql
      become: true
      become_user: postgres
      register: postgres_wal_receiver
      changed_when: false
      failed_when: >-
        postgres_wal_receiver.query_result | length == 0
        or postgres_wal_receiver.query_result[0].status != 'streaming'
      when: inventory_hostname in groups['postgres_replicas'] | default([])

- name: Verify reverse proxy upstreams
  hosts: nginx
  gather_facts: false
  tasks:
    - name: Check GitLab through the nginx upstream
      ansible.builtin.uri:
        url: "http://{{ nginx_gitlab_upstream }}:{{ nginx_gitlab_upstream_port }}/-/health"
        status_code: 200
      register: gitlab_upstream_health
      until: gitlab_upstream_health.status | default(0) == 200
      retries: 30
      delay: 5
      changed_when: false

    - name: Check Kibana through the nginx upstream
      ansible.builtin.uri:
        url: "http://{{ nginx_kibana_upstream }}:{{ nginx_kibana_upstream_port }}/api/status"
        status_code: [200, 401]
      register: kibana_upstream_health
      until: kibana_upstream_health.status | default(0) in [200, 401]
      retries: 30
      delay: 5
      changed_when: false
