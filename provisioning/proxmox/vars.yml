---
# Proxmox VE connection and VM definitions.
# The API password comes from vault_proxmox_api_password.
proxmox_api_host: "pve.campbox.tech"
proxmox_api_user: "ansible@pve"
proxmox_api_password: "{{ vault_proxmox_api_password | default('') }}"
proxmox_validate_certs: true

proxmox_node: "pve01"
# Name of an existing Ubuntu 24.04 cloud-init template.
proxmox_template: "ubuntu-2404-cloudinit-template"
proxmox_storage: "local-lvm"
proxmox_clone_format: "unspecified"
proxmox_disk_interface: "virtio0"
proxmox_bridge: "vmbr0"
proxmox_gateway: "10.10.10.1"
proxmox_nameservers:
  - "10.10.10.1"
  - "1.1.1.1"
proxmox_searchdomain: "campbox.tech"
proxmox_ciuser: "ubuntu"
proxmox_ssh_public_keys: "{{ vault_admin_authorized_keys | default([]) }}"

# Sizes are starting points. Adjust to the actual capacity plan.
# IP addresses of the VMs listed here must match inventories/production/hosts.yml.
# pg03 is intentionally absent: it runs in another cloud and is not provisioned
# by this Proxmox playbook.
proxmox_vms:
  - name: gitlab01
    vmid: 101
    cores: 4
    memory: 8192
    disk: 100
    ip: "10.10.10.11/24"
    tags: [gitlab]

  - name: pg01
    vmid: 102
    cores: 4
    memory: 16384
    disk: 200
    ip: "10.10.10.12/24"
    tags: [postgres, valkey]

  - name: pg02
    vmid: 103
    cores: 4
    memory: 16384
    disk: 200
    ip: "10.10.10.13/24"
    tags: [postgres, replica]

  - name: docker-prod-01
    vmid: 105
    cores: 4
    memory: 8192
    disk: 100
    ip: "10.10.10.15/24"
    tags: [docker, production]

  - name: docker-prod-02
    vmid: 106
    cores: 4
    memory: 8192
    disk: 100
    ip: "10.10.10.16/24"
    tags: [docker, production]

  - name: docker-test-01
    vmid: 107
    cores: 6
    memory: 8192
    disk: 128
    ip: "10.10.10.17/24"
    tags: [docker, test]

  - name: elk01
    vmid: 108
    cores: 4
    memory: 16384
    disk: 200
    ip: "10.10.10.18/24"
    tags: [elk]

  - name: nginx01
    vmid: 109
    cores: 2
    memory: 2048
    disk: 40
    ip: "10.10.10.19/24"
    tags: [nginx]

  - name: maint01
    vmid: 110
    cores: 2
    memory: 2048
    disk: 50
    ip: "10.10.10.20/24"
    tags: [maintenance, rclone]
